<script type="module">
/* 구글 로그인 + 하트·책갈피·설정 동기화 (GitHub 사이트 전용) */
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAPHs56cX-nqgmU9tR3eVGu8cJo5MqalQY",authDomain:"hanguksa-dbb5e.firebaseapp.com",projectId:"hanguksa-dbb5e",storageBucket:"hanguksa-dbb5e.firebasestorage.app",messagingSenderId:"1038931533852",appId:"1:1038931533852:web:4e919a13ebf9e9be8fffd9"});
const auth=getAuth(app),db=getFirestore(app);
const KEYS=['hearts','books','kh','snd','words','hord','hsort'],SETS=['hearts','books','kh','words'],LS=k=>'ksh-'+k;
let uid=null,timer=0;
const get=k=>{try{return localStorage.getItem(LS(k))}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(LS(k),v)}catch(e){}};
function collect(){const o={};KEYS.forEach(k=>{const v=get(k);if(v!=null)o[k]=v});return o}
async function push(){if(!uid)return;try{await setDoc(doc(db,'users',uid),{data:collect(),updated:serverTimestamp()},{merge:true});flash('저장됨')}catch(e){console.warn(e);flash('저장 실패')}}
/* 앱의 store.set이 불릴 때마다 계정에도 저장 */
{const os=store.set.bind(store);store.set=function(k,v){os(k,v);if(uid&&KEYS.includes(k)){clearTimeout(timer);timer=setTimeout(push,700)}}}
/* 맨 위 줄 버튼 */
const btn=document.createElement('button');btn.className='tib loginb';btn.type='button';btn.setAttribute('aria-label','로그인');
const ICON='<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 19.6c.9-3.6 3.8-5.4 7.2-5.4s6.3 1.8 7.2 5.4"/></svg>';
btn.innerHTML=ICON;const tb=document.querySelector('.tbtns');if(tb)tb.insertBefore(btn,tb.lastElementChild);
const st=document.createElement('style');st.textContent=`.loginb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}.loginb .lav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#1d4ed8;color:#fff;font-size:13px;overflow:hidden}.loginb .lav img{width:100%;height:100%;object-fit:cover}#lgtoast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}#lgtoast.on{opacity:.92}`;document.head.appendChild(st);
const toast=document.createElement('div');toast.id='lgtoast';document.body.appendChild(toast);let tt=0;
function flash(s){toast.textContent=s;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1600)}
function render(u){if(!u){btn.innerHTML=ICON;btn.title='구글로 로그인';btn.setAttribute('aria-label','로그인');return}
  const nm=(u.displayName||u.email||'나').trim();btn.innerHTML=`<span class="lav">${u.photoURL?`<img src="${u.photoURL}" alt="" referrerpolicy="no-referrer">`:nm[0]}</span>`;btn.title=nm+' · 눌러서 로그아웃';btn.setAttribute('aria-label','로그아웃')}
btn.addEventListener('click',async()=>{
  if(auth.currentUser){if(!confirm('로그아웃할까요?\n이 기기에 남은 하트·책갈피는 지워지고, 계정에는 그대로 남아 있어요.'))return;await signOut(auth);SETS.forEach(k=>{try{localStorage.removeItem(LS(k))}catch(e){}});try{localStorage.removeItem('ksh-syncuid')}catch(e){}location.reload();return}
  const pv=new GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,pv)}catch(e){if(e&&/popup-blocked|operation-not-supported/.test(e.code||''))await signInWithRedirect(auth,pv);else if(!/popup-closed|cancelled/.test(e.code||'')){alert('로그인하지 못했어요: '+(e.code||e.message))}}});
onAuthStateChanged(auth,async u=>{uid=u?u.uid:null;render(u);if(!u)return;
  try{const snap=await getDoc(doc(db,'users',uid));const first=get('syncuid')!==JSON.stringify(uid);let changed=false;
    if(snap.exists()){const r=(snap.data()||{}).data||{};KEYS.forEach(k=>{if(r[k]==null)return;let nv=r[k];
      if(first&&SETS.includes(k)){let a=[],b=[];try{a=JSON.parse(r[k]||'[]')}catch(e){}try{b=JSON.parse(get(k)||'[]')}catch(e){}nv=JSON.stringify([...new Set([...a,...b])])}
      if(get(k)!==nv){put(k,nv);changed=true}})}
    put('syncuid',JSON.stringify(uid));await push();
    if(changed){flash('계정의 하트를 불러왔어요');setTimeout(()=>location.reload(),600)}else if(first)flash('로그인했어요 · 하트가 계정에 저장돼요')}
  catch(e){console.warn(e);flash('계정 데이터를 불러오지 못했어요')}});
</script>
