<title>한국사 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위쪽 탭 막대 + [지도] 화면 전체 지도 위에 시대 카드(왼쪽 위)·재생 막대(아래), 넓은 화면에서는 오른쪽에 사건 패널 / [연표]·[주제별] 읽는 화면 */
:root{
  --sea:#d3e0e4; --land:#eef0ea; --river:#86aebf; --grid:#c4d3d8;
  --ink:#1f262a; --muted:#5d686e; --paper:#f7f8f5; --panel:#ffffff; --rule:#d9ded9; --chip:#edf0ec; --halo:#eef0ea;
  --seal:#b23f2c; --seal-ink:#ffffff; --focus:#2b5fb4; --pinring:#ffffff;
  --c-gojoseon:#bf8538; --c-buyeo:#8b78cc; --c-goguryeo:#cc4848; --c-baekje:#3a7cc2; --c-silla:#d39b16; --c-gaya:#37966a;
  --c-okjeo:#5e9e98; --c-dongye:#a1825f; --c-han:#7b848b; --c-balhae:#7655bf; --c-goryeo:#25958a; --c-joseon:#3f5aa8;--c-daehan:#c9a006;
  --c-japan:#6b5050; --c-south:#3a6cc2; --c-north:#c64848; --c-us:#4b78b8; --c-ussr:#b85454;
  --t-pol:#3d5a80; --t-war:#b23a48; --t-eco:#a8871a; --t-soc:#6a9f1e; --t-cul:#7a4ea6; --t-ind:#147486; --t-mod:#4c5a63; --t-wld:#8a8f96;
  --fillop:.46; --coast:#4a5156; --sea2:#e6eff2; --shadow:rgb(40 60 70/.13); --tline:rgb(255 255 255/.85);
  --a-jp:#d6336c; --a-cn:#7a5230; --a-west:#0e8a8c; --a-north:#c0392b; --a-south:#1f5fbf; --g1:#7fb3e0; --g2:#e6a157; --g3:#b39ddb; --g4:#8cc9a0; --g5:#e57f7f;
  --display:var(--ui);
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0e191e; --land:#222a2e; --river:#3d6c82; --grid:#1d2c33;
  --ink:#e6ebed; --muted:#98a4aa; --paper:#131a1d; --panel:#1a2226; --rule:#2e393e; --chip:#243034; --halo:#222a2e;
  --seal:#e2664f; --seal-ink:#1a1210; --focus:#8fb1ff; --pinring:#131a1d;
  --c-gojoseon:#d9a45c; --c-buyeo:#a593e4; --c-goguryeo:#e46b63; --c-baekje:#5e9ce0; --c-silla:#e9b93e; --c-gaya:#4fbf88;
  --c-okjeo:#7cc0b8; --c-dongye:#c4a283; --c-han:#9aa3aa; --c-balhae:#9a7fe0; --c-goryeo:#3cc0b0; --c-joseon:#7390e0;--c-daehan:#f0c93a;
  --c-japan:#b99a9a; --c-south:#5e90e0; --c-north:#e46b63; --c-us:#6f98d6; --c-ussr:#d87777;
  --t-pol:#8ea9d6; --t-war:#e47584; --t-eco:#d9bc5c; --t-soc:#a8d562; --t-cul:#b28be2; --t-ind:#50c3d3; --t-mod:#a6b4bc; --t-wld:#9ca3ab;
  --fillop:.5; --coast:#8b969b; --sea2:#14232a; --shadow:rgb(0 0 0/.35); --tline:rgb(20 26 29/.85); --a-jp:#f06595; --a-cn:#c8955f; --a-west:#3cc7c9; --a-north:#ff6b5e; --a-south:#6fa0ff; --g1:#4f8fc8; --g2:#c98236; --g3:#8f78c4; --g4:#5aa776; --g5:#d06060; color-scheme:dark } }
:root[data-theme="dark"]{
  --sea:#0e191e; --land:#222a2e; --river:#3d6c82; --grid:#1d2c33;
  --ink:#e6ebed; --muted:#98a4aa; --paper:#131a1d; --panel:#1a2226; --rule:#2e393e; --chip:#243034; --halo:#222a2e;
  --seal:#e2664f; --seal-ink:#1a1210; --focus:#8fb1ff; --pinring:#131a1d;
  --c-gojoseon:#d9a45c; --c-buyeo:#a593e4; --c-goguryeo:#e46b63; --c-baekje:#5e9ce0; --c-silla:#e9b93e; --c-gaya:#4fbf88;
  --c-okjeo:#7cc0b8; --c-dongye:#c4a283; --c-han:#9aa3aa; --c-balhae:#9a7fe0; --c-goryeo:#3cc0b0; --c-joseon:#7390e0;
  --c-japan:#b99a9a; --c-south:#5e90e0; --c-north:#e46b63; --c-us:#6f98d6; --c-ussr:#d87777;
  --t-pol:#8ea9d6; --t-war:#e47584; --t-eco:#d9bc5c; --t-soc:#a8d562; --t-cul:#b28be2; --t-ind:#50c3d3; --t-mod:#a6b4bc; --t-wld:#9ca3ab;
  --fillop:.5; --coast:#8b969b; --sea2:#14232a; --shadow:rgb(0 0 0/.35); --tline:rgb(20 26 29/.85); --a-jp:#f06595; --a-cn:#c8955f; --a-west:#3cc7c9; --a-north:#ff6b5e; --a-south:#6fa0ff; --g1:#4f8fc8; --g2:#c98236; --g3:#8f78c4; --g4:#5aa776; --g5:#d06060; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55;overflow:hidden;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.ic{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.seal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--seal);color:var(--seal-ink);font-family:var(--display);font-size:15px;line-height:1}
.tabs{display:flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px;margin-left:auto}
.tabs button{border:0;background:none;border-radius:8px;padding:5px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.view{flex:1;min-height:0;position:relative}
.view[hidden]{display:none}

/* ── 지도 화면 ── */
#v-map{display:flex}
.mapwrap{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.sea{fill:var(--sea)}
.grat{fill:none;stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--land);stroke-width:.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wland{fill:var(--land);stroke:var(--coast);stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#world:not(.on){display:none}
.chf{fill:color-mix(in srgb,var(--c-han) 55%,var(--land));opacity:.32;stroke:color-mix(in srgb,var(--c-han) 70%,var(--ink));stroke-opacity:.35;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;transition:opacity .6s}
.chf.n{fill:color-mix(in srgb,#7d8f52 55%,var(--land))}
.chl text{opacity:.7;font-style:normal;font-weight:600}
.coastl{fill:none;stroke:var(--coast);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
.coast{fill:var(--land);stroke:var(--land);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.terr{stroke:var(--tbon,var(--tbc));stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .8s,stroke .8s,opacity .7s}
.lsh{fill:var(--shadow);stroke:none}
.terr.hatch{fill-opacity:1}
.terr.out{opacity:0}
.terr.in{opacity:0}
.river{fill:none;stroke:var(--river);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.ov text{font-family:var(--ui);paint-order:stroke;stroke:var(--halo);stroke-linejoin:round}
.slab text{font-family:var(--display);font-size:17px;fill:var(--ink);stroke-width:3px;stroke-opacity:.9;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em}
.slab .sw{stroke:none}
.slab .lead,.slab .ldot{display:none}
.slab.out .lead{display:inline;stroke:var(--ink);stroke-width:1.2;opacity:.7}
.slab.out .ldot{display:inline;fill:var(--ink);stroke:var(--halo);stroke-width:1}
.slab.out text{stroke:var(--halo)!important;stroke-width:3.5px!important}
.slab{transition:opacity .6s}
.nb text{font-size:12.5px;font-style:italic;fill:var(--muted);stroke-width:3px;text-anchor:middle;letter-spacing:.06em}
.rl text{font-size:10.5px;fill:color-mix(in srgb,var(--river) 75%,var(--ink));stroke:none;font-style:italic;opacity:.85}
.cap rect{fill:var(--ink);stroke:var(--halo);stroke-width:1.5}
.cap text{font-size:11.5px;font-weight:700;fill:var(--ink);stroke-width:3px}
.mt path{fill:var(--muted)}
.mt text{font-size:10.5px;fill:var(--muted);stroke-width:2.5px}
.pin{cursor:pointer}
.pin .hit{fill:transparent;stroke:none}
.pin .dot{stroke:var(--pinring);stroke-width:1.8}
.pin .psh{fill:rgb(0 0 0/.18)}
.pin .burst{fill:var(--t-war);stroke:var(--pinring);stroke-width:1.5;stroke-linejoin:miter}
.pin .burst2{fill:var(--pinring);stroke:none}
.pin.k-war.sel .burst{stroke:var(--ink);stroke-width:2}
@keyframes clash{0%,80%,100%{transform:none}85%{transform:scale(1.25) rotate(8deg)}92%{transform:scale(.95) rotate(-4deg)}}
.pin .pole{stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}
.pin .knob{fill:var(--ink)}
.pin .flg{stroke:var(--panel);stroke-width:1;stroke-linejoin:round;transform-box:fill-box;transform-origin:0 50%;animation:flap 2.6s ease-in-out infinite}
.pin.flagpin .psh{cx:0;cy:2;rx:4.5;ry:1.5}
.pin.flagpin .gl{animation:none!important}
.pin.flagpin.pop .gl{animation:plant .6s cubic-bezier(.3,1.5,.5,1) both!important}
.pin.flagpin.sel .flg,.pin.flagpin.fresh .flg{stroke:var(--ink);stroke-width:1.4;animation-duration:1s}
.pin.flagpin .ring{display:none}
.pin.fall .gl{animation:stamp .7s cubic-bezier(.3,1.4,.5,1)}
.pin.fall .gp{stroke-width:2.4}
@keyframes stamp{0%{transform:scale(2.6);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes flap{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.9)}}
@keyframes plant{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
.pin.gone{display:none}
.pin .rip{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rip 1.6s cubic-bezier(.2,.7,.3,1) both;pointer-events:none}
@keyframes rip{from{transform:scale(.8);opacity:.9}to{transform:scale(7);opacity:0}}
.pin.found .gl{animation:crown 1.1s cubic-bezier(.3,1.6,.5,1)}
@keyframes crown{0%{transform:translateY(-14px) scale(.2);opacity:0}60%{opacity:1}100%{transform:none}}
.pin.found.fresh .gl,.pin.found.sel .gl{animation:crown 1.1s cubic-bezier(.3,1.6,.5,1)}
.pin .gp{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.pin .gp.f{fill:#fff;stroke:none}
.pin .gl{transform-box:fill-box;transform-origin:center}
.pin.k-war .gl{animation:clash 3.6s ease-in-out infinite}
.pin.fresh .gl,.pin.sel .gl{animation:var(--anim)}
.pin.k-war{--anim:clash .9s ease-in-out 4}.pin.k-pol,.pin.k-ind{--anim:wave .7s ease-in-out 4}.pin.k-soc,.pin.k-mod{--anim:flick .45s ease-in-out 6}.pin.k-eco{--anim:spin .8s ease-in-out 3}.pin.k-cul,.pin.k-wld{--anim:twirl 1.2s ease-in-out 2}
@keyframes clash{0%,78%,100%{transform:none}83%{transform:rotate(-16deg) scale(1.18)}88%{transform:rotate(12deg) scale(1.1)}93%{transform:rotate(-6deg)}}
@keyframes wave{0%,100%{transform:none}50%{transform:skewY(-8deg) scale(1.08)}}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12,0.92)}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes twirl{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.pin text{font-size:11.5px;font-weight:600;fill:var(--ink);stroke-width:3px;cursor:pointer}
.pin.hide{display:none}
.pin.wait{display:none}
.pin.pop .dot{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
.aflow{fill:none;stroke:var(--panel);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:.004 .045;vector-effect:non-scaling-stroke;animation:flow 1.3s linear infinite;opacity:.95}
.arw.dim .aflow{display:none}.arw.draw .aflow{opacity:0;animation:flow 1.3s linear infinite,show .3s 1s forwards}
@keyframes flow{to{stroke-dashoffset:-.049}}@keyframes show{to{opacity:.95}}
.pin .ring{fill:none;stroke-width:2.5;opacity:0}
.pin.pop .ring{animation:ring 1.1s ease-out}
.pin.sel .dot{stroke:var(--ink);stroke-width:2.5}
.pin.sel .ring{opacity:1;stroke:var(--ink);animation:none}
.ov .nolab{display:none}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.6)}}

.fcard{position:absolute;left:12px;top:12px;max-width:min(360px,calc(100% - 70px));background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  box-shadow:0 4px 18px rgb(0 0 0/.12);padding:10px 12px 10px;z-index:4;display:flex;flex-direction:column;gap:6px}
.fcard .eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.fcard .eyebrow b{color:var(--seal);font-weight:700}
.fcard h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.3;text-wrap:balance}
.fcard .capt{margin:0;font-size:13px;color:var(--ink);opacity:.9}
.fcard .leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.fcard .leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fcard .leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.fcard .leg i.h{background-image:repeating-linear-gradient(45deg,currentColor 0 2px,transparent 2px 5px)!important;border:1px solid currentColor}
.fcard .fbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--chip)}
.fcard .more{display:none}
.fcard .leg{display:none!important}
.fcard h2{cursor:pointer;display:flex;align-items:center;gap:6px}
.fcard h2::after{content:"⌄";font-family:var(--ui);font-size:15px;color:var(--muted);transform:translateY(-3px)}
.fcard.open h2::after{content:"⌃";transform:translateY(3px)}
.fcard:not(.open) .capt,.fcard:not(.open) .leg,.fcard:not(.open) .fbtns{display:none}
.fcard:not(.open){gap:2px;padding-block:8px}

.zoom{position:absolute;right:12px;top:12px;z-index:4;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgb(0 0 0/.1)}
.zoom button{border:0;background:none;width:36px;height:36px;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:hover{background:var(--chip)}

.ticker{position:absolute;left:50%;bottom:calc(var(--dockh,112px) + 4px);transform:translate(-50%,8px);z-index:4;background:var(--ink);color:var(--panel);
  border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.ticker.on{opacity:1;transform:translate(-50%,0)}
.ticker b{color:var(--seal);font-weight:700;margin-right:6px}

.dock{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--rule);
  padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:8px}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;box-shadow:0 2px 8px rgb(0 0 0/.18)}
.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.yr{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.yr .y{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.yr .y small{font-size:15px;margin-right:2px}
.yr .ft{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);display:grid;place-items:center}
.ib:hover{background:var(--chip)}
.spd{width:auto;padding:0 9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.listbtn{width:auto;padding:0 10px;gap:5px;display:inline-flex;font-size:12.5px;font-weight:600}

.reign{display:flex;flex-wrap:wrap;gap:4px 6px;min-height:0}
.reign:empty{display:none}
.rg1{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;background:color-mix(in srgb,var(--rc) 15%,transparent);color:var(--ink);white-space:nowrap}
.rg1 i{width:8px;height:8px;border-radius:50%;background:var(--rc);flex:none}
.rg1 em{font-style:normal;color:var(--muted);font-weight:500;margin-right:1px}
.evd .reign{margin-top:-4px}
.slider{position:relative;height:34px;margin:0 6px;touch-action:none;cursor:pointer}
.slider .trk{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.slider .seg{position:absolute;top:0;bottom:0;opacity:.75}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:var(--seal);opacity:.85}
.slider .tick{position:absolute;top:7px;width:1px;height:10px;background:var(--rule)}
.slider .elab{position:absolute;top:19px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;font-weight:600;pointer-events:none}
.slider .thumb{position:absolute;top:3px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--panel);border:3px solid var(--seal);box-shadow:0 1px 4px rgb(0 0 0/.3)}
.slider:focus-visible{outline:none}.slider:focus-visible .thumb{outline:2px solid var(--focus);outline-offset:2px}

/* 사건 패널: 넓은 화면은 오른쪽 기둥, 좁은 화면은 아래에서 올라오는 시트 */
.panel{flex:none;width:370px;border-left:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0;z-index:6}
.ph{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.ph h3{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .x{display:none}
.pb{flex:1;min-height:0;overflow:auto;padding:12px 14px 20px;overscroll-behavior:contain}
.grab{display:none}
.elist .fh button{display:block;padding:12px 8px 4px;font-family:var(--display);font-size:15.5px;color:var(--ink);border-bottom:1px solid var(--rule);border-radius:0}
.elist .fh b{display:block;font-family:var(--ui);font-size:11px;color:var(--muted);font-weight:700}
.elist .fh.cur button{color:var(--seal)}
.elist li.yet,.playing .elist li.fut{opacity:.38}
.pfr{display:flex;gap:4px;flex:none}.pfr[hidden]{display:none}

/* 글씨체 통일: 제목·연도·시기 띠도 본문과 같은 글꼴, 굵기로만 구분 */
.top h1,.fcard h2,.evd h2,.esum h2,.era>header h2,.bubble h4,.sethd h2,.trh h3,.laws h2,.kname b,.kph h1,.ppera h2,.kgk h3,.kghd h2,.ovsumh h2,.stab tbody th,.elist .fh button{font-weight:700!important;letter-spacing:-.01em!important}
.hzrg,.oreg,.oband{font-weight:700;letter-spacing:.04em!important;font-size:13.5px}
.hzyr,.oyr,.fyr,.yr .y,.tl .d,.lawl .ly,.evd .dt,.vs span{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hzyr,.oyr,.fyr{font-size:12.5px}
.ocard.fr{font-weight:600}
.slab text{font-weight:700}

body,body *{font-size-adjust:var(--fsa,none)}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px;width:100%}
.fontgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:left}
.fontgrid button b{font-size:15px;font-weight:700}.fontgrid button small{font-size:12px;color:var(--muted)}
.fontgrid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fontsec{flex-direction:column;align-items:stretch!important}

.hzall{display:flex;height:100%;min-height:100%;width:max-content}
.hsec{flex:none;height:100%;position:relative}.hsec .hzwrap{height:100%}
.hsec+.hsec{border-left:3px solid var(--ink)}
.vsec{margin-bottom:34px}.vsec .ovsech{position:sticky;left:0;padding:14px 16px 4px;display:flex;align-items:baseline;gap:10px}
.ovsecsum{padding:4px 16px 0;max-width:1100px}

#v-ov.railed:not([hidden]){display:flex;flex-direction:row}
#v-ov.railed #ovread{flex:1 1 0;min-width:0}
#v-ov.railed .rhead{display:none}
#ovrail{flex:none;width:118px;display:flex;flex-direction:column;gap:8px;padding:10px 8px;border-right:1px solid var(--rule);background:var(--paper);overflow-y:auto;scrollbar-width:none;box-sizing:border-box}
#ovrail .ovdir{order:0;display:flex;align-self:stretch}#ovrail .ovdir button{flex:1;padding:5px 0}
#ovrail #ovchips{order:1;display:flex;flex-direction:column;gap:4px;overflow:visible;flex:none!important;padding:0}
#ovrail #ovchips .chip{width:100%;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.25;padding:7px 10px;border-radius:10px;font-size:13px;word-break:keep-all}
@media (max-width:640px){#ovrail{width:76px;padding:8px 5px;gap:6px}#ovrail #ovchips .chip{font-size:11.5px;padding:6px 7px}#ovrail .ovdir button{font-size:11px}}

/* 구조도: 주제마다 색 다른 카드 + 제목 색 포인트 + 칸마다 상자 */
.trcard{--trc:var(--seal);margin:0 0 22px;padding:18px 20px 20px;border-radius:18px;background:color-mix(in srgb,var(--trc) 6%,var(--panel));border:1px solid color-mix(in srgb,var(--trc) 22%,var(--rule));box-shadow:0 1px 0 color-mix(in srgb,var(--trc) 10%,transparent)}
.trcard .tree{margin:0}
.trcard .trh{border-bottom:0;padding:0 0 12px;margin:0 0 6px;display:flex;flex-direction:column;gap:3px}
.trcard .trh h3{color:var(--trc);font-size:22px;display:flex;align-items:center;gap:10px}
.trcard .trh h3::before{content:'';flex:none;width:6px;height:22px;border-radius:3px;background:var(--trc)}
.trcard .trh span{padding-left:16px}
.trcard .hn{background:var(--panel);border:1px solid color-mix(in srgb,var(--trc) 20%,var(--rule));border-radius:12px;padding:8px 12px;box-shadow:0 1px 2px rgb(0 0 0/.04)}
.trcard .hn b{color:color-mix(in srgb,var(--trc) 55%,var(--ink))}
.trcard .hn .ht{color:var(--trc)}
.trcard .hlink,.trcard .hkid::before{background:none;border-color:color-mix(in srgb,var(--trc) 45%,transparent)}
.trcard .hlink{height:0;border-top:2px solid color-mix(in srgb,var(--trc) 45%,transparent)}
.trcard .hkid::after{border-color:color-mix(in srgb,var(--trc) 45%,transparent)}
.trcard .harr{color:var(--trc)}
.trcard .trflow{background:color-mix(in srgb,var(--trc) 9%,var(--panel));border-left:4px solid var(--trc)}
.trcard .trflow h4{color:var(--trc)}
.trcard .laws h2{color:var(--trc)}
@media (max-width:600px){.trcard{padding:14px 12px 14px;border-radius:14px}.trcard .hn{padding:6px 9px;max-width:158px}.trcard .hn b{white-space:normal}}
#trjump button[style]{color:var(--trc);font-weight:700}

.jump,.chips,.htree,.hchain{cursor:grab}.dragging{cursor:grabbing!important;user-select:none}.dragging *{pointer-events:none}
.jump{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}

.tree .hrow{gap:0!important}
.tree .hlink{width:16px!important;flex:none}
.tree .hkid::before{width:16px!important}
.top .tabs{min-width:0!important;flex:0 1 auto!important}
.top>:first-child{min-width:0;overflow:hidden}
.top .tbtns,.top .hnav{flex:none}
@media (max-width:760px){.top h1{font-size:0!important;gap:0}.top h1 .seal{font-size:15px}}

.tree .hkids:not(.one)>.hkid::after{display:block!important}
.tree .hkids.one>.hkid::after{display:none!important}
.top .tabs{overflow-x:auto!important;overflow-y:hidden}

/* 낱말: 밑줄을 글자에 바짝 */
.gw,.gw.tr{border-bottom:0!important;text-decoration-line:underline;text-decoration-thickness:1.5px;text-underline-offset:2px;text-decoration-skip-ink:none}
.gw{text-decoration-style:dotted;text-decoration-color:color-mix(in srgb,var(--seal) 75%,transparent)}
.gw.tr{text-decoration-style:solid;text-decoration-color:color-mix(in srgb,var(--seal) 80%,transparent)}
/* 낱말 사전 */
.gbook .gidx{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.gbook .gidx button{min-width:34px;padding:5px 8px;border:1px solid color-mix(in srgb,var(--trc) 25%,var(--rule));border-radius:8px;background:var(--panel);color:var(--trc);font-weight:800;cursor:pointer}
.gbook .gh{margin:14px 0 6px;color:var(--trc);font-size:18px;border-bottom:2px solid color-mix(in srgb,var(--trc) 35%,transparent);padding-bottom:2px}
.gbook .gl2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:0}
.gbook .gl2>div{background:var(--panel);border:1px solid color-mix(in srgb,var(--trc) 18%,var(--rule));border-radius:10px;padding:8px 11px}
.gbook dt{font-weight:800;font-size:15px;color:color-mix(in srgb,var(--trc) 60%,var(--ink));display:flex;align-items:center;gap:8px}
.gbook dd{margin:3px 0 0;font-size:13px;line-height:1.55;color:var(--ink);opacity:.85}
.gbook .gtr{margin-left:auto;border:0;background:color-mix(in srgb,var(--trc) 12%,var(--panel));color:var(--trc);font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;cursor:pointer}
.gbook .trh span .gw{pointer-events:none}

/* 낱말 풀이 말풍선: 진한 검정 대신 밝은 카드 */
.glpop{--gc2:#6d28d9;background:color-mix(in srgb,var(--gc2) 6%,var(--panel))!important;color:var(--ink)!important;border:1px solid color-mix(in srgb,var(--gc2) 28%,var(--rule));border-left:4px solid var(--gc2);box-shadow:0 8px 24px rgb(0 0 0/.14)!important}
.glpop b{color:var(--gc2)!important;font-size:14px}
.glpop p{opacity:.88}
.glpop .trbtn{background:color-mix(in srgb,var(--gc2) 12%,var(--panel))!important;color:var(--gc2)!important;border:0!important}

.pl{border:0;background:none;padding:0;margin:0;font:inherit;color:color-mix(in srgb,var(--trc,var(--seal)) 78%,var(--ink));font-weight:700;cursor:pointer;text-decoration:none}
.pl:hover{text-decoration:none;background:color-mix(in srgb,var(--trc,var(--seal)) 10%,transparent);border-radius:3px}
.hn>b .pl{text-decoration:none;color:inherit}

/* 인물·왕 페이지는 맨 위 줄(검색·하트·설정) 아래에만 */
.kpage{top:var(--hdrH,56px)!important;z-index:65!important}
.glpop{z-index:68!important}

.kpng p{margin:0 0 6px;display:flex;gap:10px;align-items:baseline;line-height:1.7}
.kpng b{flex:none;min-width:64px;font-size:12.5px;font-weight:800;color:var(--muted)}
.kpng span{font-size:14.5px}
.kpn{border:0;background:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer}
.kpn:hover{color:var(--seal)}

/* 왕 페이지: 생몰 → 몇 대 왕 → 재위, 업적은 조금 크게, 칸마다 선 */
.kpsub2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.kpsub2 .kplife{font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.kpsub2 .kpord{font-size:15px;color:var(--ink)}.kpsub2 .kpord b{color:var(--kc,var(--seal))}
.kpin>section{border-top:1px solid var(--rule);padding-top:14px;margin-top:16px}
.kpal li{font-size:16px!important;line-height:1.65;font-weight:500}

/* ── 한눈에 구분: 공통 규칙 ── 칸 = 연한 색 상자 + 왼쪽 색 막대 + 굵은 색 제목 */
.kpin>section.kpsec{border-top:0;margin-top:12px;padding:12px 16px 14px;border-radius:14px;background:color-mix(in srgb,var(--sc) 5%,var(--panel));border:1px solid color-mix(in srgb,var(--sc) 18%,var(--rule));border-left:4px solid var(--sc)}
.kpin>section.kpsec>h3{color:var(--sc);font-size:14px;font-weight:800;letter-spacing:0;margin:0 0 8px}
.kpng p>b{color:#fff!important;background:var(--nc,#64748b);border-radius:6px;padding:1px 8px;min-width:0!important;font-size:12px;line-height:1.7}
.kpng p{gap:8px}
/* 시대 요약 칸: 주제마다 색 상자 */
.sumblk{background:color-mix(in srgb,var(--tc) 6%,var(--panel));border:1px solid color-mix(in srgb,var(--tc) 20%,var(--rule));border-top:3px solid var(--tc);border-radius:12px;padding:10px 12px 11px}
.sumblk h4{font-size:13.5px!important;font-weight:800;letter-spacing:0!important;margin-bottom:6px!important}
.sumblk h4::before{display:none!important}
.sumbox{background:none!important;border:0!important;padding:0!important}
/* 검색 결과 묶음 */
.srgrp{margin:6px 4px 10px;border-radius:12px;background:color-mix(in srgb,var(--sc) 4%,var(--panel));border:1px solid color-mix(in srgb,var(--sc) 16%,var(--rule));border-left:4px solid var(--sc);padding:2px 4px 4px}
.srgrp>h4{color:var(--sc)!important;font-size:13px!important;font-weight:800;margin:8px 8px 2px!important}
.srgrp .sri b{color:color-mix(in srgb,var(--sc) 35%,var(--ink))}
/* 인물 탭: 시대마다 상자, 나라 표시는 색 알약 */
.ppera{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:14px 18px 16px}
.ppera h2{border-bottom:2px solid color-mix(in srgb,var(--seal) 60%,var(--ink))!important}
.pplg span{padding:1px 8px;border-radius:999px;background:color-mix(in srgb,currentColor 10%,transparent)}

/* 연표 목록: 사건마다 주제 색 막대, 제목도 주제 색으로 살짝 */
.tl>li[data-id]{border-left:3px solid color-mix(in srgb,var(--tc) 70%,transparent);padding-left:12px;border-radius:2px}
.tl>li[data-id] h3{color:color-mix(in srgb,var(--tc) 55%,var(--ink))}
.tl>li[data-id]>.d{color:color-mix(in srgb,var(--tc) 60%,var(--ink));font-weight:700}
.tl>li.sgrp{border-left:3px solid color-mix(in srgb,var(--muted) 50%,transparent);padding-left:12px}

/* 지도 재생줄: 화살표 대신 속도 버튼 */
#prev,#next{display:none!important}
#spd{display:inline-flex!important;align-items:center;justify-content:center;min-width:46px;font-weight:800;font-size:14px}

/* 지도 위 글씨: 주아는 원래 굵어서 가짜 굵게를 끔 */
#v-map,#v-map *{font-synthesis-weight:none;font-synthesis:none}
#fcard h2,#topban b{font-weight:400!important}

#v-dc .gidx{display:none}
.dcjump button{font-weight:800;color:#6d28d9;min-width:28px}
.dccard{margin-top:14px}

/* 반포·조직 알림: 지도 맨 위 한 줄. 뜰 때는 시대 카드·확대 버튼이 살짝 내려가고, 카드를 펼쳐 두면 알림이 카드 밑으로 */
.topban{top:calc(var(--toph,0px) + 6px)!important;max-width:calc(100% - 24px)!important;z-index:6}
.fcard,.zoom{transition:transform .3s}
#v-map.banon .fcard:not(.open),#v-map.banon .zoom{transform:translateY(26px)}
#v-map.banon.fcopen .zoom{transform:none}
.topban.below{top:var(--bantop)!important}

/* 화살표: 그냥 선으로 그은 화살표 (머리도 선) */
.ahd path.ahb,.ahd path.ahl{fill:none!important;stroke-linecap:round;stroke-linejoin:round;paint-order:normal}
.ahd path.ahb{stroke:var(--halo)!important;stroke-width:7;opacity:.85}
.ahd path.ahl{stroke-width:3.4}
.ahd.inv path.ahl{stroke-width:5}
.ahd.inv path.ahb{stroke-width:9}
.aflow{display:none!important}
.arw.inv:not(.dim) .af{filter:none}

.reign .rgbrk{flex-basis:100%;height:0}
#replay{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:7;display:flex;align-items:center;gap:8px;padding:12px 22px;border:0;border-radius:999px;background:var(--ink);color:var(--panel);font-size:17px;box-shadow:0 8px 24px rgb(0 0 0/.25);cursor:pointer}
#replay[hidden]{display:none}
#replay svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.ocard .h,.fev .h,.hzn,.sri b,.tl h3{word-break:keep-all}
.dmlab text{font-size:12px!important;stroke-width:2px!important;letter-spacing:.02em}

.kcol li.kach{font-size:12.8px;line-height:1.38;font-weight:600;color:var(--ink);padding:2px 3px}
/* 왕계표: 축선은 줄 끝까지, 나라마다 색 상자 */
.kgcols>.kcol{flex:1 0 auto}
.kgcols::after{content:'';flex:1000 0 30px;align-self:stretch;background:linear-gradient(color-mix(in srgb,var(--muted) 30%,var(--panel)),color-mix(in srgb,var(--muted) 30%,var(--panel))) 0 calc(var(--hb) + 45px)/100% 5px no-repeat}
.kgn{background:color-mix(in srgb,var(--kc) 5%,var(--panel));border:1px solid color-mix(in srgb,var(--kc) 22%,var(--rule));border-left:5px solid var(--kc);border-radius:16px;padding:6px 18px 14px}
.kgn .kghd h2{color:color-mix(in srgb,var(--kc) 75%,var(--ink))}

.gbook .gl2>div.gp{border-left:4px solid #047857;background:color-mix(in srgb,#047857 5%,var(--panel))}
.gbook .gpn{border:0;background:none;padding:0;font:inherit;font-weight:800;font-size:15px;color:#047857;cursor:pointer}
.gbook .gptag{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:#047857;border-radius:6px;padding:0 6px;margin-left:auto}

.ppsep{flex-basis:100%;margin:6px 0 2px;padding-top:6px;border-top:1px dashed var(--rule);font-size:12px;font-weight:800;color:var(--muted)}

/* 주아는 원래 굵은 글꼴: 앱 전체에서 가짜 굵게를 끔 */
html,html *{font-synthesis-weight:none!important;font-synthesis:none!important}

.ppgrid{display:flex;flex-direction:column;gap:8px}
.pprow{display:flex;align-items:baseline;gap:12px}
.pprow>b{flex:none;min-width:58px;text-align:center;color:#fff;background:var(--nc);border-radius:6px;padding:1px 8px;font-size:12.5px}
.pprow .ppnames{flex:1;min-width:0}
.ppgrid .ppsep{margin:4px 0 0}

.orgs .orgh{margin:16px 0 4px;font-size:15px;color:var(--trc);border-bottom:2px solid color-mix(in srgb,var(--trc) 35%,transparent);padding-bottom:3px}
.orgl b{color:color-mix(in srgb,var(--trc) 60%,var(--ink))}

/* 형광펜: 엄청 중요한 사건 */
.tl>li.hlt h3{display:inline;background:linear-gradient(transparent 52%,color-mix(in srgb,#ffe14d 85%,transparent) 52%,color-mix(in srgb,#ffe14d 85%,transparent) 92%,transparent 92%);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tl>li.hlt h3::after{content:'빈출';font-size:.62em;font-weight:700;color:#b45309;border:1px solid #f59e0b;border-radius:4px;padding:0 3px;margin-left:5px;vertical-align:2px}
.tl>li.hlt h3+*{margin-top:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl>li.hlt h3{background:linear-gradient(transparent 52%,rgb(255 214 0/.35) 52%,rgb(255 214 0/.35) 92%,transparent 92%)}}

.hzd.hzg{border-left:3px solid #6d28d9;padding-left:8px}
.hzd.hzg b.gw{display:block;font-size:13px;color:#6d28d9;text-decoration:none!important;cursor:pointer}
.hzd.hzg em{font-size:11px}

#hovtip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12.5px;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s;box-shadow:0 4px 14px rgb(0 0 0/.18)}
#hovtip.on{opacity:.95;transform:none}

.wbk{border:0;background:none;padding:2px;margin-left:6px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;vertical-align:middle}
.wbk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
.wbk[aria-pressed="true"]{color:#6d28d9}.wbk[aria-pressed="true"] svg{fill:currentColor}
.gbook dt .wbk{margin-left:auto}.gbook dt .gtr+.wbk{margin-left:4px}
#dcbk{font-weight:800;color:#6d28d9;white-space:nowrap}#dcbk[aria-pressed="true"]{background:#6d28d9;color:#fff;border-radius:8px}
.dcempty{color:var(--muted);font-size:14px;padding:12px 4px}
.tlkh{margin:14px 0 6px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--seal) 5%,var(--panel));border:1px solid color-mix(in srgb,var(--seal) 18%,var(--rule));border-left:4px solid var(--seal)}
.tlkh h3{margin:0 0 8px;font-size:14px;color:var(--seal)}.tlkh h3:last-child{margin:14px 0 0}

#iconleg{position:absolute;right:62px;top:calc(var(--toph,54px) + 10px);z-index:8;width:min(270px,calc(100% - 80px));max-height:calc(100% - var(--toph,54px) - 140px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 8px 28px rgb(0 0 0/.18);padding:10px 12px 12px}
#iconleg[hidden]{display:none}
#iconleg .lghd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}#iconleg .lghd b{font-size:15px}
#iconleg .lgx{border:0;background:none;font-size:15px;color:var(--muted);cursor:pointer}
#iconleg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#iconleg li{display:flex;align-items:center;gap:10px;font-size:13.5px}
#iconleg .lgi{width:26px;height:26px;flex:none;overflow:visible}
#iconleg .lgi .flg{animation:none}
#iconleg .lgt{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-size:12.5px}
#iconleg .lgt>b{display:block;margin-bottom:5px;color:var(--muted)}
#iconleg .lgt div{display:flex;flex-wrap:wrap;gap:4px 10px}
#iconleg .lgt i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* 연대표: 시대끼리 끊기지 않고 한 줄로 이어 보이게 */
.hsec+.hsec{border-left:0!important}
.vsec{margin-bottom:0!important}
.ovsech2{position:sticky;left:0;display:flex;align-items:baseline;gap:8px;padding:6px 16px 2px;font-size:13px;color:var(--muted);border-top:1px dashed var(--rule)}
.ovsech2 b{color:var(--ink);font-size:14.5px}
.sumtg{margin-left:auto;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);cursor:pointer}
